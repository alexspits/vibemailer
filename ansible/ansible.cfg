[defaults]
inventory = ./inventory.yml
roles_path = ./roles
interpreter_python = auto_silent
callback_result_format = yaml

[ssh_connection]
pipelining = True
# accept-new: новый ключ хоста (в т.ч. после смены порта) принимается автоматически,
# изменившийся — нет. Иначе плейбук зависнет на запросе подтверждения.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
